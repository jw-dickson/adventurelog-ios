[project]
name = "adventurelog-companion"
version = "0.1.0"
description = "Self-hosted companion for the AdventureLog iOS app: Live Activity pushes."
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[http2]>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["companion"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear, simplify
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
# The formatter owns line length; long strings and comments are left alone.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body"]
