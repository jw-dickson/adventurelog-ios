name: ci

# Public lane: GitHub-hosted runners, with one optional secret (the privacy denylist), so anyone (including forks and a future
# upstream) gets the same checks.
#
# - Package tests run on every pull request push and on main. Swift warnings fail the build here
#   (and in the UI job), not on a Mac building locally or for TestFlight.
# - `privacy` scans for secrets (gitleaks) and for anything on the maintainer's private denylist.
# - The companion is linted and format-checked with ruff before its tests.
# - Simulator UI tests run on pull requests that touch more than docs, on one Simulator (the
#   hosted runners are too small for two: cloned Simulators made each test take minutes).
#   A push to main skips them: the pull request already ran them on that code.
# - The screenshot gallery (light, dark, XXL) runs only when asked: Actions → ci → Run workflow,
#   with "Capture the screenshot gallery" ticked, or `make gallery` on a Mac.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gallery:
        description: Capture the screenshot gallery (light, dark, XXL)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Tokens.swift is generated from Design/tokens.json; fail if someone edited one without the other.
      - name: Design tokens are in sync
        run: python3 scripts/gen-tokens.py --check

      - name: Package tests
        run: |
          mkdir -p build
          set +e
          make test-packages SWIFT_FLAGS="-Xswiftc -warnings-as-errors" 2>&1 | tee build/packages.log
          status=${PIPESTATUS[0]}
          python3 scripts/ci-annotate.py build/packages.log $([ $status -ne 0 ] && echo --tail)
          exit $status

  # AdventureLogKit is Foundation only, so it also builds and tests on Linux: minutes sooner
  # than a macOS runner, and it keeps the Kit free of Apple-only APIs. ALStore (Keychain) and
  # ALDesign (SwiftUI) stay macOS-only.
  kit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          # python3 for scripts/ci-annotate.py
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
      - name: Kit tests on Linux
        working-directory: Packages/AdventureLogKit
        shell: bash
        run: |
          mkdir -p ../../build
          set +e
          swift test 2>&1 | tee ../../build/kit-linux.log
          status=${PIPESTATUS[0]}
          python3 ../../scripts/ci-annotate.py ../../build/kit-linux.log $([ $status -ne 0 ] && echo --tail)
          exit $status

  # The companion service (Python), on Linux: quick, so it runs every time.
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The store tests run on SQLite and on this disposable Postgres (#20).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: companion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U companion" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: Companion
        run: pip install -e '.[test,postgres]' ruff==0.16.8
      - name: Lint (ruff)
        working-directory: Companion
        run: |
          ruff check --output-format github .
          ruff format --check --diff .
      - name: Companion tests
        working-directory: Companion
        env:
          COMPANION_TEST_DATABASE_URL: postgresql://companion:companion@localhost:5432/companion_test
        run: pytest -q -rs

  # Secrets (gitleaks, default rules plus .gitleaks.toml) across the whole history, then the
  # maintainer's denylist (scripts/privacy-scan.py) over the tree, the pull request's commits,
  # title and body. The denylist is the PRIVACY_DENYLIST secret; forks don't get it and skip
  # that step. Nothing a scan finds is printed, only where it was found.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets (gitleaks)
        env:
          VERSION: 8.24.0
          SHA256: cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
      - name: Private denylist
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/privacy-scan.py --commits "$BASE..$HEAD"
          else
            python3 scripts/privacy-scan.py
          fi

  # Decides whether the app needs the Simulator: not for a pull request that only changes docs
  # or the companion.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|Design/|Companion/)|\.md$|^LICENSE$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs or the companion only: skipping the Simulator."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  ui:
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build for testing
        run: |
          DEST=$(scripts/simulator.sh destination)
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          echo "Using $DEST"
          mkdir -p build
          set +e
          xcodebuild build-for-testing -project AdventureLog.xcodeproj -scheme AdventureLog \
            -destination "$DEST" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES 2>&1 | tee build/build.log
          status=${PIPESTATUS[0]}
          python3 scripts/ci-annotate.py build/build.log $([ $status -ne 0 ] && echo --tail)
          exit $status

      # The live-server tests skip themselves here (no AL_TEST_SERVER). The gallery has its own job.
      - name: UI tests on the Simulator
        run: |
          scripts/simulator.sh grant-location   # location allowed, as on a phone that said yes
          set +e
          xcodebuild test-without-building -project AdventureLog.xcodeproj -scheme AdventureLog \
            -destination "$DEST" -derivedDataPath build/DerivedData \
            -skip-testing:AdventureLogUITests/GalleryUITests -parallel-testing-enabled NO \
            -resultBundlePath build/UITests.xcresult 2>&1 | tee build/ui.log
          status=${PIPESTATUS[0]}
          python3 scripts/ci-annotate.py build/ui.log $([ $status -ne 0 ] && echo --tail)
          exit $status

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: build/UITests.xcresult
          retention-days: 14

  gallery:
    if: github.event_name == 'workflow_dispatch' && inputs.gallery
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write # the gallery branch
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Screenshot gallery
        run: |
          DEST=$(scripts/simulator.sh destination)
          echo "Using $DEST"
          mkdir -p build
          set +e
          xcodebuild test -project AdventureLog.xcodeproj -scheme AdventureLog \
            -destination "$DEST" -derivedDataPath build/DerivedData \
            -only-testing:AdventureLogUITests/GalleryUITests \
            -resultBundlePath build/Gallery.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/gallery.log
          status=${PIPESTATUS[0]}
          python3 scripts/ci-annotate.py build/gallery.log $([ $status -ne 0 ] && echo --tail)
          exit $status

      # The light, dark and XXL screenshots live in here; `make gallery` exports them on a Mac.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-xcresult
          path: build/Gallery.xcresult
          retention-days: 30

      # The same screenshots as PNGs on the `gallery` branch (one commit, replaced each run), so a
      # review can be put together without a Mac. Only the synthetic seed is ever on screen.
      # Only after the whole gallery passed, so a failed run never replaces a complete gallery.
      - name: Put the screenshots on the gallery branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          [ -d build/Gallery.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/Gallery.xcresult --output-path build/gallery
          python3 scripts/gallery-names.py build/gallery build/gallery-named
          cd build/gallery-named
          printf 'Gallery from %s (%s).\n' "$SOURCE_REF" "$SOURCE_SHA" > README.md
          git init -q -b gallery
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Gallery from $SOURCE_REF ($SOURCE_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gallery
