# AdventureLog for iOS — XcodeGen spec. Generate the project with `make generate`.
# The .xcodeproj is not committed; this file is the source of truth.
name: AdventureLog

options:
  bundleIdPrefix: app.adventurelog
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AdventureLogKit:
    path: Packages/AdventureLogKit
  ALDesign:
    path: Packages/ALDesign
  ALStore:
    path: Packages/ALStore

targets:
  AdventureLog:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Shared
    dependencies:
      - package: AdventureLogKit
      - package: ALDesign
      - package: ALStore
      - target: AdventureLogWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AdventureLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background refresh keeps the reminder window rolling and the trip fresh (Stage 3).
        UIBackgroundModes:
          - fetch
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - app.adventurelog.refresh
        NSLocationWhenInUseUsageDescription: On trip days you agreed to, AdventureLog records your route and the stops you make, so the Log can show your day against the plan. It stays on this phone.
        NSLocationAlwaysAndWhenInUseUsageDescription: On trip days you agreed to, AdventureLog records your route and notices when you reach a planned stop, even with the app closed. It stays on this phone.
        # Live Activities for flights and booked tours (Stage 4).
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: AdventureLog connects to your self-hosted AdventureLog server when it's on your local network.
        NSAppTransportSecurity:
          # Self-hosted servers on a home network or a dev Mac (http://192.168.x.x, localhost).
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AL_BUNDLE_ID)
        PRODUCT_NAME: AdventureLog
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: $(AL_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        # Push notifications, for Live Activity pushes from the companion (Stage 4b). The App ID
        # needs the Push Notifications capability; archiving for TestFlight switches it to production.
        CODE_SIGN_ENTITLEMENTS: App/AdventureLog.entitlements

  # The Live Activity's Lock Screen card and Dynamic Island (Stage 4). Signing needs its own
  # bundle id, $(AL_BUNDLE_ID).widgets, in the signing setup outside the repo.
  AdventureLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Shared
    dependencies:
      - package: AdventureLogKit
      - package: ALDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AdventureLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AL_BUNDLE_ID).widgets
        PRODUCT_NAME: AdventureLogWidgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: $(AL_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES

  AdventureLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
      # The seeded trip, for the offline browsing test and the screenshot gallery.
      - path: Fixtures/adventurelog-v0.13.0/responses/collections__all.json
        buildPhase: resources
      - path: Fixtures/adventurelog-v0.13.0/responses/collections__detail.json
        buildPhase: resources
    dependencies:
      - target: AdventureLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AL_BUNDLE_ID).uitests
        TEST_TARGET_NAME: AdventureLog
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AdventureLog:
    build:
      targets:
        AdventureLog: all
        AdventureLogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AdventureLogUITests
    archive:
      config: Release
